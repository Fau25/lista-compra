<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tienda · Mi Compra</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tienda">
<meta name="theme-color" content="#F3EEF1">
<link rel="manifest" href="manifest-tienda.json">
<link rel="apple-touch-icon" href="tienda-180.png">
<script>
  // Abierta desde el icono de la pantalla de inicio: directa al modo tienda
  if (navigator.standalone || matchMedia("(display-mode: standalone)").matches) location.replace("./?tienda=1");
</script>
<style>
  @font-face{font-family:"Sora";src:url("fuentes/sora-400.woff2") format("woff2");font-weight:400}
  @font-face{font-family:"Sora";src:url("fuentes/sora-600.woff2") format("woff2");font-weight:600 700}
  :root{--bg:#F3EEF1;--sup:rgba(255,255,255,.62);--t:#2A2433;--t2:#857D92;--pri:#FFCBB3}
  body{margin:0;background:radial-gradient(60% 40% at 8% 4%,rgba(190,172,255,.5),transparent 70%),radial-gradient(55% 40% at 70% 102%,rgba(255,186,164,.45),transparent 70%),var(--bg);color:var(--t);font-family:"Sora",system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
  .caja{max-width:360px;background:var(--sup);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(120,100,140,.1);border-radius:22px;padding:28px 24px;text-align:center}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:22px;margin:14px 0 6px}
  p{color:var(--t2);font-size:15px;line-height:1.45;margin:0 0 18px}
  a{display:block;background:var(--pri);color:var(--t);text-decoration:none;font-weight:700;border-radius:12px;padding:14px}
</style>
</head>
<body>
  <div class="caja">
    <img src="tienda-180.png" alt="">
    <h1>Modo tienda</h1>
    <p>Para tenerlo como icono aparte: pulsa <b>Compartir</b> y luego <b>Añadir a pantalla de inicio</b>. Al abrirlo desde ahí irá directo al modo tienda.</p>
    <a href="./?tienda=1">Abrir el modo tienda</a>
  </div>
</body>
</html>
