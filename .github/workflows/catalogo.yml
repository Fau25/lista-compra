name: Catálogo y web

on:
  workflow_dispatch:
    inputs:
      rehacer:
        description: "Fotos a volver a buscar (slugs separados por comas)"
        required: false
        default: ""
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # lunes ~5-6 h en España

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      - name: Descargar catálogo
        id: catalogo
        if: github.event_name != 'push'
        run: python scripts/catalogo.py
        env:
          CP: "04230"

      - name: Fotos libres de las recetas
        if: steps.catalogo.outcome == 'success'
        run: python scripts/fotos.py && python scripts/recetas.py
        env:
          REHACER: ${{ github.event.inputs.rehacer }}

      - name: Guardar catálogo si ha cambiado
        if: steps.catalogo.outcome == 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add web/catalogo.json web/recetas.json web/fotos scripts/fotos_registro.txt
          git diff --cached --quiet || (git commit -m "Catálogo y fotos actualizados $(date +%F)" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
